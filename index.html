  <!-- 只有通过 http(s) 打开时才注册 PWA；file:// 下浏览器会忽略清单。 -->
  <script>
    if (location.protocol !== 'file:') {
      var manifest = document.createElement('link');
      manifest.rel = 'manifest';
      manifest.href = './manifest.webmanifest';
      document.head.appendChild(manifest);
    }
  </script>

<body>
  <div id="boot" class="boot">
    <div class="boot__mark" aria-hidden="true">♪</div>
    <p class="boot__text">正在准备五线谱…</p>
  </div>

  <div id="app" class="app-shell" hidden>
    <header id="app-bar" class="app-bar"></header>
    <main id="view" class="view" tabindex="-1"></main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="主要导航"></nav>
    <div id="snackbar" class="snackbar" role="status" aria-live="polite"></div>
    <div id="dialog-root"></div>
  </div>

  <noscript>
    <div class="noscript">这个应用需要 JavaScript 才能运行。请开启 JavaScript 后重新打开。</div>
  </noscript>

  <!-- VexFlow 5.0.0，已内置字体，完全离线；必须在应用模块之前加载。 -->
  <script src="./vendor/vexflow.js"></script>
  <script>
    /*
     * file:// 下浏览器会以 CORS 为由拦截 <script type="module">，
     * 所以双击打开时改用预先生成的传统 IIFE 包（js/app.file.js）。
     * 通过 http(s) 访问时仍然加载正常的 ES modules。
     * 两个文件由同一份源码生成，改动后运行 npm run build:file。
     */
    (function () {
      var isFile = location.protocol === 'file:';
      var script = document.createElement('script');
      if (isFile) {
        script.src = './js/app.file.js';
      } else {
        script.type = 'module';
        script.src = './js/app.js';
      }
      script.onerror = function () {
        var boot = document.getElementById('boot');
        if (boot) {
          boot.innerHTML = '<div class="noscript">应用脚本加载失败。<br>请通过 <code>npm start</code> 启动本地服务器，或确认 js/ 目录完整。</div>';
        }
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
